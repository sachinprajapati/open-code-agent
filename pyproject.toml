[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "open-code-agent"
version = "0.1.0"
description = "Provider-agnostic coding agent foundation"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "OpenCodeAgent contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic-settings>=2.7",
  "rich>=13.9",
  "typer>=0.15",
]

[project.scripts]
open-code-agent = "open_code_agent.cli:app"

[project.urls]
Homepage = "https://github.com/open-code-agent/open-code-agent"
Repository = "https://github.com/open-code-agent/open-code-agent"

[dependency-groups]
dev = [
  "mcp>=1.6,<2",
  "mypy>=1.14",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/open_code_agent"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=open_code_agent --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["open_code_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["open_code_agent"]
warn_unreachable = true
show_error_codes = true
